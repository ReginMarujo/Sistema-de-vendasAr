services:
  - type: web
    name: sistema-de-vendas-ar
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vendas-db
          property: connectionString

databases:
  - name: vendas-db
    databaseName: vendas_db
    user: postgres